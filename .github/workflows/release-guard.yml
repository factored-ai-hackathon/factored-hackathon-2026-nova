name: Release guard

# Pull requests into main (production) must come from development. Make "Release comes from
# development" a required status check on main so GitHub blocks the merge otherwise.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited] # edited: the base was changed to main

permissions: {}

jobs:
  source:
    name: Release comes from development
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_BRANCH" != "development" ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull requests into main must come from development (this one comes from $HEAD_REPO:$HEAD_BRANCH). Change the base branch to development."
            exit 1
          fi
          echo "OK: release from development"
