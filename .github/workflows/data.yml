name: Data pipeline

# Builds the production data model: dbt --target prod -> latam_curated (Athena).
# It runs as a job of the Deploy workflow (deploy.yml, "Data pipeline"), which every merge to main
# triggers: it is skipped when the merge does not touch data/dbt, uv.lock or pyproject.toml.
# It can also be run by hand (Actions -> Data pipeline -> Run workflow), e.g. with full_refresh
# to rebuild the incremental table from scratch.
# Models and their tests run together (dbt build): a failing test stops the models that
# depend on it, so broken data never replaces the published tables.
# Everyone else builds in their own schema (--target dev, see data/dbt/README.md).
on:
  workflow_call:
    inputs:
      full_refresh:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Rebuild the incremental table from scratch (dbt --full-refresh)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC: assume the dbt role without AWS keys

concurrency:
  group: data-prod
  cancel-in-progress: false

jobs:
  build:
    name: dbt build (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DBT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: dbt build
        run: uv run dbt build --target prod ${{ inputs.full_refresh && '--full-refresh' || '' }}

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-${{ github.run_id }}
          path: |
            data/dbt/target/run_results.json
            data/dbt/logs/dbt.log
          retention-days: 30
