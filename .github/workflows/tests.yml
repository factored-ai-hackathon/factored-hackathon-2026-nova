name: Tests

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development] # main runs these through deploy.yml, before deploying
  workflow_call:

permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's changed files through the API

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Which jobs run depends on the changed files:
#   frontend/**  -> Frontend
#   backend/**   -> Backend + Evaluation (evals exercise the backend agent)
#   evals/**     -> Evaluation
#   data/**      -> Data model (dbt parse; the production build is .github/workflows/data.yml)
#   docs/**, infra/** and Markdown files anywhere -> nothing (Terraform is planned by hand)
#   anything else (ml/, .github/, root files) -> everything
# Skipped jobs count as passed, so they work with required status checks.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      evals: ${{ steps.filter.outputs.evals }}
      data: ${{ steps.filter.outputs.data }}
      other: ${{ steps.filter.outputs.other }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A file counts for a filter only if it matches every pattern in it.
          predicate-quantifier: every
          filters: |
            frontend:
              - 'frontend/**'
              - '!**/*.md'
            backend:
              - 'backend/**'
              - '!**/*.md'
            evals:
              - 'evals/**'
              - '!**/*.md'
            data:
              - 'data/**'
              - '!**/*.md'
            other:
              - '**'
              - '!frontend/**'
              - '!backend/**'
              - '!evals/**'
              - '!data/**'
              - '!docs/**'
              - '!infra/**'
              - '!**/*.md'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      # Live tests are skipped without HF_TOKEN / BEDROCK_LIVE, so no secrets are needed.
      - name: Unit tests
        run: uv run pytest tests

  evaluation:
    name: Evaluation
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.evals == 'true' ||
      needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Smoke evals (ES/PT) with a fake model; EVAL_LIVE is not set, so no provider is called.
      # -c keeps backend/pyproject.toml as the pytest config (pythonpath, asyncio mode).
      - name: Agent smoke evals
        run: uv run pytest -c pyproject.toml ../evals/agent

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  data:
    name: Data model
    needs: changes
    if: needs.changes.outputs.data == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Checks SQL/Jinja, refs, sources and test definitions without AWS credentials.
      # Running the models and tests against Athena happens in data.yml (prod) or locally (dev).
      - name: dbt parse
        run: uv run dbt parse --no-partial-parse
