# No secrets here: authentication comes from your AWS CLI profile
# (aws configure, see docs/setup.md). The bucket defaults to
# fh26-hackaton-data; override with DBT_WORK_BUCKET if needed.
#
# Two targets:
#   dev  (default) your own copy: latam_curated_dev_<DBT_DEV_NAME>. Build and test freely.
#   prod latam_curated, what notebooks, ML and the app read. Only the data pipeline
#        (.github/workflows/data.yml, on merge to main) builds it: --target prod.
latam_bank:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: "{{ env_var('AWS_REGION', 'us-east-2') }}"
      database: awsdatacatalog
      schema: "latam_curated_dev_{{ env_var('DBT_DEV_NAME', 'shared') | lower }}"
      work_group: hackathon
      s3_staging_dir: "s3://{{ env_var('DBT_WORK_BUCKET', 'fh26-hackaton-data') }}/athena-results/dbt/"
      s3_data_dir: "s3://{{ env_var('DBT_WORK_BUCKET', 'fh26-hackaton-data') }}/curated/"
      s3_data_naming: schema_table
      threads: 4
    prod:
      type: athena
      region_name: "{{ env_var('AWS_REGION', 'us-east-2') }}"
      database: awsdatacatalog
      schema: latam_curated
      work_group: hackathon
      s3_staging_dir: "s3://{{ env_var('DBT_WORK_BUCKET', 'fh26-hackaton-data') }}/athena-results/dbt/"
      s3_data_dir: "s3://{{ env_var('DBT_WORK_BUCKET', 'fh26-hackaton-data') }}/curated/"
      s3_data_naming: schema_table
      threads: 4
