version: 2

# Raw tables: the original CSV files in the data-root bucket, all columns STRING.
# This file is the single place where their columns are defined. After changing it,
# recreate the tables with:  dbt run-operation create_raw_tables --args '{replace: true}'
# (dropping a raw table never deletes the files in S3).

sources:
  - name: latam_raw
    description: Original LATAM Bank dataset as delivered (gzipped CSV, all columns STRING).
    database: awsdatacatalog
    schema: latam_raw
    tables:
      - name: branches
        meta: {partitioned: false}
        columns:
          - name: branch_id
          - name: branch_code
          - name: branch_name
          - name: branch_type
          - name: address
          - name: city
          - name: state
          - name: country
          - name: postal_code
          - name: geographic_zone
          - name: phone
          - name: email
          - name: opening_time
          - name: closing_time
          - name: has_atms
          - name: atm_count
          - name: has_teller_windows
          - name: teller_window_count
          - name: latitude
          - name: longitude
          - name: branch_opening_date
          - name: branch_status
      - name: customers
        meta: {partitioned: false}
        columns:
          - name: customer_id
          - name: document_number
          - name: document_type
          - name: first_name
          - name: last_name
          - name: date_of_birth
          - name: gender
          - name: email
          - name: mobile_phone
          - name: landline_phone
          - name: address
          - name: city
          - name: state
          - name: country
          - name: postal_code
          - name: detected_accent
          - name: segment
          - name: credit_score
          - name: estimated_monthly_income
          - name: occupation
          - name: marital_status
          - name: education_level
          - name: registration_date
          - name: registration_branch_id
          - name: customer_status
          - name: last_updated
          - name: accepts_marketing
      - name: daily_exchange_rates
        meta: {partitioned: false}
        columns:
          - name: date
          - name: source_currency
          - name: target_currency
          - name: exchange_rate
          - name: buy_rate
          - name: sell_rate
          - name: source
      - name: marketing_campaigns
        meta: {partitioned: false}
        columns:
          - name: campaign_id
          - name: campaign_name
          - name: description
          - name: campaign_type
          - name: campaign_objective
          - name: promoted_product
          - name: target_segment
          - name: target_country
          - name: start_date
          - name: end_date
          - name: budget
          - name: campaign_status
          - name: expected_conversion_rate
      - name: products
        meta: {partitioned: false}
        columns:
          - name: product_id
          - name: customer_id
          - name: product_type
          - name: product_number
          - name: currency
          - name: current_balance
          - name: credit_limit
          - name: interest_rate
          - name: opening_date
          - name: expiration_date
          - name: opening_branch_id
          - name: product_status
          - name: opening_channel
          - name: has_linked_app
          - name: days_past_due
          - name: last_transaction_date
          - name: last_updated
      - name: service_agents
        meta: {partitioned: false}
        columns:
          - name: agent_id
          - name: employee_code
          - name: first_name
          - name: last_name
          - name: email
          - name: phone
          - name: native_accent
          - name: country_of_origin
          - name: assigned_branch_id
          - name: agent_type
          - name: experience_level
          - name: languages
          - name: specialty
          - name: hire_date
          - name: avg_csat
          - name: total_monthly_interactions
          - name: agent_status
          - name: work_shift
      - name: call_center_interactions
        meta: {partitioned: true}
        columns:
          - name: interaction_id
          - name: interaction_date
          - name: process_date
          - name: customer_id
          - name: agent_id
          - name: interaction_type
          - name: channel
          - name: contact_reason
          - name: reason_category
          - name: duration_seconds
          - name: wait_time_seconds
          - name: was_resolved
          - name: requires_followup
          - name: detected_sentiment
          - name: sentiment_score
          - name: customer_detected_accent
          - name: agent_used_accent
          - name: was_escalated
          - name: mentioned_products
          - name: has_transcript
          - name: has_recording
      - name: call_transcripts
        description: >
          Read from a Parquet copy (data/scripts/convert_transcripts.py) because
          every full_text has line breaks, which Athena can't read from CSV.
        meta: {partitioned: false, format: parquet, location: "s3://fh26-hackaton-data/converted/call_transcripts/"}
        columns:
          - name: transcript_id
          - name: interaction_id
          - name: process_date
          - name: customer_id
          - name: agent_id
          - name: full_text
          - name: customer_text
          - name: agent_text
          - name: detected_language
          - name: detected_accent
          - name: accent_confidence
          - name: detected_keywords
          - name: mentioned_entities
          - name: detected_intents
          - name: main_topics
          - name: transcription_model
          - name: audio_quality
          - name: duration_seconds
      - name: campaign_sends
        meta: {partitioned: true}
        columns:
          - name: send_id
          - name: send_date
          - name: process_date
          - name: campaign_id
          - name: customer_id
          - name: send_channel
          - name: template_used
          - name: subject
          - name: send_status
          - name: was_delivered
          - name: was_opened
          - name: open_date
          - name: was_clicked
          - name: click_date
          - name: click_count
          - name: had_conversion
          - name: conversion_date
          - name: conversion_value
          - name: open_device
          - name: open_country
          - name: failure_reason
          - name: send_cost
      - name: complaints
        meta: {partitioned: true}
        columns:
          - name: complaint_id
          - name: creation_date
          - name: process_date
          - name: customer_id
          - name: case_type
          - name: category
          - name: subcategory
          - name: reception_channel
          - name: affected_product_id
          - name: related_branch_id
          - name: origin_interaction_id
          - name: description
          - name: claimed_amount
          - name: currency
          - name: priority
          - name: status
          - name: assigned_agent_id
          - name: assignment_date
          - name: first_response_date
          - name: resolution_date
          - name: closing_date
          - name: sla_breached
          - name: resolution_days
          - name: resolution
          - name: compensation_granted
          - name: resolution_satisfaction
          - name: is_repeat_complainer
      - name: digital_events
        meta: {partitioned: true}
        columns:
          - name: event_id
          - name: event_date
          - name: process_date
          - name: customer_id
          - name: session_id
          - name: event_type
          - name: event_category
          - name: channel
          - name: platform
          - name: browser
          - name: app_version
          - name: page_url
          - name: page_title
          - name: action
          - name: element_id
          - name: product_id
          - name: event_value
          - name: duration_seconds
          - name: ip_address
          - name: ip_country
          - name: ip_city
          - name: is_mobile
          - name: referrer
          - name: utm_source
          - name: utm_medium
          - name: utm_campaign
      - name: satisfaction_surveys
        meta: {partitioned: true}
        columns:
          - name: survey_id
          - name: survey_date
          - name: process_date
          - name: interaction_id
          - name: customer_id
          - name: agent_id
          - name: survey_type
          - name: send_channel
          - name: main_score
          - name: nps_category
          - name: question_1_text
          - name: question_1_response
          - name: question_2_text
          - name: question_2_response
          - name: question_3_text
          - name: question_3_response
          - name: open_comments
          - name: comment_sentiment
          - name: response_time_hours
          - name: campaign_response_rate
      - name: transactions
        meta: {partitioned: true}
        columns:
          - name: transaction_id
          - name: transaction_date
          - name: process_date
          - name: product_id
          - name: customer_id
          - name: transaction_type
          - name: transaction_category
          - name: amount
          - name: currency
          - name: amount_usd
          - name: channel
          - name: branch_id
          - name: merchant_name
          - name: merchant_category
          - name: transaction_country
          - name: transaction_city
          - name: transaction_status
          - name: response_code
          - name: is_fraud
          - name: fraud_score
          - name: latitude
          - name: longitude
