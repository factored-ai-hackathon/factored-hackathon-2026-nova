[project]
name = "fh26-backend"
version = "0.1.0"
description = "Chat API (FastAPI) and agent (LangGraph + LangChain)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.43.104",
    "fastapi>=0.141.1",
    "langchain-aws>=1",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "../evals/agent"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: calls the real LLM provider; runs only when HF_TOKEN or BEDROCK_LIVE is set"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]
